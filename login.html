<!DOCTYPE html>
<html>
<head>
  <title>Login | Campus Issue Reporter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:linear-gradient(135deg,#ff512f,#dd2476);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }
    .card{
      width:360px;
      background:white;
      padding:30px;
      border-radius:14px;
      box-shadow:0 15px 35px rgba(0,0,0,0.25);
    }
    h2{
      text-align:center;
      color:#dd2476;
      margin-bottom:20px;
    }
    input{
      width:100%;
      padding:14px;
      margin:12px 0;
      border-radius:10px;
      border:1px solid #ccc;
      font-size:15px;
    }
    button{
      width:100%;
      padding:14px;
      background:#dd2476;
      color:white;
      border:none;
      border-radius:10px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      margin-top:10px;
    }
    button:hover{background:#c31432;}
  </style>
</head>
<body>

<div class="card">
  <h2>Login</h2>

  <input id="loginId" placeholder="Email or Mobile Number">
  <input id="loginPass" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
</div>

<script>
function login(){
  const user = JSON.parse(localStorage.getItem("user"));

  if(!user){
    alert("No account found. Please register.");
    return;
  }

  if(
    (loginId.value === user.email || loginId.value === user.mobile)
    && loginPass.value === user.password
  ){
    localStorage.setItem("loggedIn","true");
    window.location.href = "index.html";
  }else{
    alert("Invalid login credentials");
  }
}
</script>

</body>
</html>
